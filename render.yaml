# Render Blueprint (https://render.com/docs/blueprint-spec).
# Deploys the API and the React UI as two web services. Ollama is NOT deployed here: Render's
# web services have no persistent disk and no GPU on the plans this blueprint targets, so a
# locally-self-hosted Phi-3-mini can't live on the same box. Instead the API is pointed at a
# hosted OpenAI-compatible endpoint (Groq/Together/Fireworks/OpenRouter all work) via
# LLM_PROVIDER=openai_compatible. See README "Deploying to Render" for the two supported paths
# (hosted small model vs. your own Ollama box with OLLAMA_BASE_URL pointed at it).
#
# Usage: push this repo to GitHub, then in Render: New -> Blueprint -> pick the repo.
# Set the secret env vars (marked sync: false) in the Render dashboard after the first deploy.
services:
  - type: web
    name: matchwright-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: OPENAI_COMPATIBLE_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_COMPATIBLE_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_COMPATIBLE_AGENT_MODEL
        value: qwen/qwen3.8-27b   # gpt-oss-120b loops on the text ReAct agent; qwen completes it
      - key: OPENAI_COMPATIBLE_API_KEY
        sync: false        # set in the Render dashboard; never commit real keys
      - key: API_KEY
        sync: false        # set your own; used by the UI and Postman
      - key: OFFLINE_MODE
        value: "false"
      - key: USE_AGENT
        value: "true"
      - key: USE_EMBEDDINGS
        value: "false"     # sentence-transformers is heavy; enable once the box is sized for it
      - key: DATA_DIR
        value: /app/data
      - key: DB_PATH
        value: /app/data/results.db
      - key: CORS_ORIGINS
        value: https://matchwright-web.onrender.com
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: LANGFUSE_ENABLED
        value: "false"      # flip to "true" once LANGFUSE_PUBLIC_KEY/SECRET_KEY are set below
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com   # or https://us.cloud.langfuse.com — must match your project's region
    disk:
      name: matchwright-data
      mountPath: /app/data
      sizeGB: 1

  - type: web
    name: matchwright-web
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: starter
    autoDeploy: true
    envVars:
      # Render's Blueprint `fromService` only exposes a bare host/port, and nginx needs a full
      # URL with scheme, so set this explicitly to the API service's public URL once it's known
      # (Render dashboard -> matchwright-api -> the onrender.com URL), e.g.
      # https://matchwright-api.onrender.com
      - key: API_UPSTREAM
        sync: false
      - key: API_KEY
        sync: false            # must match matchwright-api's API_KEY
